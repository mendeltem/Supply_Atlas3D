/* ---------- Bedienelemente des Datenblocks ---------- */
function updateEventCount(){
  const el = document.getElementById("evCount");
  if (!el) return;
  const n = EarthTwin.events.length;
  el.textContent = n ? `${n} ${UI().loaded}` : UI().noEvents;
}
function download(name, text, mime){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function wireDataPanel(){
  const win = document.getElementById("evWindow");
  if (win){ win.value = String(eventCfg.days);
    win.addEventListener("change", e => { eventCfg.days = +e.target.value; render(); }); }

  const t1 = document.getElementById("evToggle");
  if (t1) t1.addEventListener("click", () => {
    eventCfg.show = !eventCfg.show; t1.classList.toggle("on", eventCfg.show); render(); });

  const t2 = document.getElementById("evOnly");
  if (t2) t2.addEventListener("click", () => {
    eventCfg.only = !eventCfg.only; t2.classList.toggle("on", eventCfg.only); render(); });

  const demo = document.getElementById("evDemo");
  if (demo) demo.addEventListener("click", () => { EarthTwin.setEvents(DEMO_EVENTS); });

  const clr = document.getElementById("evClear");
  if (clr) clr.addEventListener("click", () => { EarthTwin.clearEvents(); });

  const dj = document.getElementById("dlJson");
  if (dj) dj.addEventListener("click", () => download("earth_twin_sites.json", EarthTwin.toJSON(), "application/json"));

  const dc = document.getElementById("dlCsv");
  if (dc) dc.addEventListener("click", () => download("earth_twin_sites.csv", EarthTwin.toCSV(), "text/csv"));

  const box = document.getElementById("geoSearch");
  if (box) box.addEventListener("keydown", ev => {
    if (ev.key !== "Enter") return;
    const q = box.value.trim();
    if (!q) return;
    const m = q.match(/^(-?\d+(?:[.,]\d+)?)\s*[,; ]\s*(-?\d+(?:[.,]\d+)?)$/);
    if (m){
      const la = parseFloat(m[1].replace(",", ".")), lo = parseFloat(m[2].replace(",", "."));
      const hit = EarthTwin.near(la, lo, 400)[0];
      EarthTwin.flyTo([la, lo], 2.2);
      if (hit){ selectedSite = hit.site; showDossier(hit.site); }
    } else {
      const ql = q.toLowerCase();
      const s = SITE_INDEX[q] || EarthTwin.match(q) ||
                ALL_SITES.find(x => x.n.toLowerCase().startsWith(ql)) ||
                ALL_SITES.find(x => x.n.toLowerCase().includes(ql)) ||
                ALL_SITES.find(x => x.id.includes(slugify(q)));
      if (s) EarthTwin.flyTo(s.id, 2.2);
    }
  });
  updateEventCount();
}

/* ==========================================================================
   EINSTELLUNGEN MERKEN
   Alles was du an- oder ausschaltest wird lokal gespeichert und beim
   nächsten Öffnen wiederhergestellt: Ebenen, Filter, Zeitfenster, Sprache,
   Gitter und Nachtgrenze, dazu die zuletzt betrachtete Stelle des Globus.
   ========================================================================== */

const STORE_KEY = "earthTwin." + (typeof BUILD_ID !== "undefined" ? BUILD_ID : "default") + ".v1";
let storeOk = true, memStore = null;

function storeRead(){
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){
    storeOk = false;
    try { return memStore ? JSON.parse(memStore) : null; } catch(e2){ return null; }
  }
}
function storeWrite(obj){
  const raw = JSON.stringify(obj);
  memStore = raw;
  try { window.localStorage.setItem(STORE_KEY, raw); }
  catch(e){ storeOk = false; }
}
function storeClear(){
  memStore = null;
  try { window.localStorage.removeItem(STORE_KEY); } catch(e){}
}

/* ---------- Zustand einsammeln ---------- */
function snapshot(){
  const o = {v:1, lang:currentLang, state:{}, layers:{}};
  for (const k in state) o.state[k] = state[k];
  for (const k of LAYER_KEYS){
    const c = LAYERS[k].cfg;
    o.layers[k] = {show:c.show, allLv:c.allLv, filter:c.filter};
  }
  o.link = {show:linkCfg.show, filter:linkCfg.filter};
  o.ev = {show:eventCfg.show, only:eventCfg.only, days:eventCfg.days};
  if (typeof bubbleCfg !== "undefined") o.bub = {show:bubbleCfg.show, layer:bubbleCfg.layer};
  o.open = uiCfg.open;
  return o;
}
function currentView(){
  return {rot:[+rotation[0].toFixed(2), +rotation[1].toFixed(2)], z:+zoomF().toFixed(3)};
}

/* ---------- Zustand anwenden ---------- */
let startLang = "en", pendingZoom = null;
(function applySaved(){
  const s = storeRead();
  if (!s || s.v !== 1) return;
  if (s.lang === "de" || s.lang === "en") startLang = s.lang;
  if (s.state) for (const k in s.state) if (k in state) state[k] = !!s.state[k];
  if (s.layers) for (const k of LAYER_KEYS){
    const c = s.layers[k]; if (!c) continue;
    LAYERS[k].cfg.show   = !!c.show;
    LAYERS[k].cfg.allLv  = !!c.allLv;
    LAYERS[k].cfg.filter = LAYERS[k].meta[c.filter] ? c.filter : "";
  }
  if (s.link){ linkCfg.show = !!s.link.show; linkCfg.filter = LINK_META[s.link.filter] ? s.link.filter : ""; }
  if (s.ev){ eventCfg.show = !!s.ev.show; eventCfg.only = !!s.ev.only;
             if (typeof s.ev.days === "number") eventCfg.days = s.ev.days; }
  if (s.bub && typeof bubbleCfg !== "undefined"){
    bubbleCfg.show = !!s.bub.show;
    bubbleCfg.layer = (s.bub.layer === "" || LAYERS[s.bub.layer]) ? s.bub.layer : "d";
  }
  if (typeof s.open === "string") uiCfg.open = s.open;
  if (s.view){
    if (Array.isArray(s.view.rot)){ rotation[0] = s.view.rot[0]; rotation[1] = s.view.rot[1]; }
    if (typeof s.view.z === "number") pendingZoom = s.view.z;
  }
})();

/* Kopfzeilen-Schalter optisch nachziehen */
function syncHeadToggles(){
  document.querySelectorAll(".toggle[data-key]").forEach(el => {
    el.classList.toggle("on", !!state[el.dataset.key]);
  });
}

/* ---------- Automatisch sichern ---------- */
let lastSaved = "", viewDirty = false;
function saveNow(){
  const snap = snapshot();
  snap.view = currentView();
  storeWrite(snap);
  lastSaved = JSON.stringify(snapshot());
  viewDirty = false;
  const el = document.getElementById("saveState");
  if (el) el.textContent = storeOk ? UI().savedOn : UI().savedOff;
}
setInterval(() => {
  const now = JSON.stringify(snapshot());
  if (now !== lastSaved || viewDirty) saveNow();
}, 1200);

globeCv.addEventListener("pointerup", () => { viewDirty = true; });
globeCv.addEventListener("wheel", () => { viewDirty = true; }, {passive:true});

/* ---------- Bedienelement ---------- */
function wireSettings(){
  const el = document.getElementById("saveState");
  if (el) el.textContent = storeOk ? UI().savedOn : UI().savedOff;
  const btn = document.getElementById("cfgReset");
  if (btn) btn.addEventListener("click", () => {
    storeClear();
    for (const k of LAYER_KEYS){
      LAYERS[k].cfg.show = true;
      LAYERS[k].cfg.allLv = (k === "h");
      LAYERS[k].cfg.filter = "";
    }
    linkCfg.show = true; linkCfg.filter = "";
    eventCfg.show = true; eventCfg.only = false; eventCfg.days = 90;
    if (typeof bubbleCfg !== "undefined"){ bubbleCfg.show = true; bubbleCfg.layer = "d"; }
    state.borders = true; state.graticule = false; state.night = false; state.rotate = false;
    if ("relief" in state) state.relief = false;
    uiCfg.open = "view";
    syncHeadToggles();
    lastSaved = "";
    updateSiteUI(); render();
  });
}

/* Sprache aus dem Speicher übernehmen und Schalter nachziehen */
requestAnimationFrame(() => {
  syncHeadToggles();
  if (pendingZoom){
    scale = Math.max(120, Math.min(Math.min(W,H)*3.2, (Math.min(W,H)/2.25) * pendingZoom));
    needsPick = true;
  }
  render();
  lastSaved = JSON.stringify(snapshot());
});

/* ==========================================================================
   MOBILMODUS
   Auf schmalen Schirmen wird das Bedienfeld zur Schublade hinter einem
   Knopf, und die Symbole schrumpfen mit der Kugel mit.
   ========================================================================== */

const MOBILE_W = 720;
function isNarrow(){ return Math.min(window.innerWidth, window.innerHeight) < 560 ||
                            window.innerWidth < MOBILE_W; }

function setPanel(open){
  document.body.classList.toggle("panel-open", open);
  const b = document.getElementById("panelBtn");
  if (b) b.classList.toggle("open", open);
}
function togglePanel(){ setPanel(!document.body.classList.contains("panel-open")); }

(function wireMobile(){
  const btn = document.getElementById("panelBtn");
  const scrim = document.getElementById("panelScrim");
  if (btn) btn.addEventListener("click", e => { e.stopPropagation(); togglePanel(); });
  if (scrim) scrim.addEventListener("click", () => setPanel(false));
  window.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.body.classList.contains("panel-open")) setPanel(false);
  });
  /* Auf dem Telefon startet die Schublade geschlossen, damit der Globus frei liegt */
  setPanel(!isNarrow());
  window.addEventListener("resize", () => { if (!isNarrow()) setPanel(true); });
})();

/* Wird ein Ort angetippt, schließt sich die Schublade, sonst verdeckt sie das Dossier */
const dossierBeforeMobile = showDossier;
showDossier = function(s){
  dossierBeforeMobile(s);
  if (isNarrow()) setPanel(false);
};
if (typeof openNews === "function"){
  const newsBeforeMobile = openNews;
  openNews = function(b){ newsBeforeMobile(b); if (isNarrow()) setPanel(false); };
}

/* Auf Tippschirmen bleibt der Schwebekasten weg: er hängt sonst nach dem
   Antippen stehen und verdeckt genau die Stelle, die man treffen wollte. */
const tooltipBeforeMobile = showTooltip;
showTooltip = function(f, x, y){
  if (isNarrow()){ hideTooltip(); return; }
  tooltipBeforeMobile(f, x, y);
};
const siteTipBeforeMobile = siteTooltip;
siteTooltip = function(s, x, y){
  if (isNarrow()){ hideTooltip(); return; }
  siteTipBeforeMobile(s, x, y);
};

window.addEventListener("resize", resize);
setLang(typeof startLang !== 'undefined' ? startLang : 'en'); // Setzt Englisch als Standard-Sprache beim Start
resize();
requestAnimationFrame(tick);
