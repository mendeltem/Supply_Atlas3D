<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Earth Digital Twin · Wirtschaftsatlas</title>
<style>
  :root{
    --bg:#04060c;
    --panel:rgba(13,17,26,.88);
    --panel-border:rgba(120,150,190,.18);
    --text:#ffffff;
    --dim:#9ca8be;
    --accent:#37c8e8;
    --land-stroke:rgba(235,245,255,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);}
  canvas#globe{position:absolute;inset:0;cursor:grab}
  canvas#globe.dragging{cursor:grabbing}
  canvas#stars{position:absolute;inset:0;pointer-events:none}

  .panel{
    position:absolute;top:18px;left:18px;width:300px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:12px;padding:14px 14px 10px;backdrop-filter:blur(8px);
    box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:10; color: #ffffff;
  }
  
  /* NEU: Sprach-Toggle Styling */
  .panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 4px; }
  .panel h1{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;color:#ffffff; margin:0;}
  .panel h1 .dot{width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#9fdcff,#1c6fd4 60%,#0a2f66)}
  .lang-switch { font-size: 11px; font-weight: 600; color: var(--dim); display:flex; gap: 4px; user-select:none; }
  .lang-switch span { cursor: pointer; transition: color 0.2s; }
  .lang-switch span:hover { color: #ffffff; }
  .lang-switch span.active { color: var(--accent); }

  .panel .hint{font-size:10.5px;color:var(--dim);margin:0 0 10px}
  
  .toggle{display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1);
    border-radius:8px;padding:7px 11px;margin-bottom:6px;font-size:12px;
    cursor:pointer;user-select:none;transition:background .15s; color: #ffffff;}
  .toggle:hover{background:rgba(255,255,255,.15)}
  .toggle .led{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .15s}
  .toggle.on .led{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .panel .credit{font-size:9.5px;color:#70809c;margin-top:8px;line-height:1.5}

  select#resourceFilter {
    width: 100%; background-color: rgba(20, 30, 45, 0.9); border: 1px solid rgba(255,255,255,.2); 
    border-radius: 8px; padding: 8px 11px; color: #ffffff !important; 
    font-size: 13px; font-weight: 500; outline: none; cursor: pointer;
  }
  select#resourceFilter option { background-color: #0d111a; color: #ffffff; padding: 4px; }
  select#resourceFilter optgroup { background-color: #1a2233; color: var(--dim); font-style: normal; font-weight: 600; }

  .tooltip{
    position:absolute;min-width:250px;max-width:320px;pointer-events:none;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
    padding:11px 13px;backdrop-filter:blur(8px);box-shadow:0 12px 36px rgba(0,0,0,.6);
    z-index:20;display:none;font-size:11.5px;line-height:1.45; color: #ffffff;}
  .tooltip .tt-name{font-size:13.5px;font-weight:600;display:flex;gap:7px;align-items:center}
  .tooltip .tt-region{color:var(--dim);font-size:10.5px;margin:1px 0 8px}
  .tt-row{display:flex;justify-content:space-between;gap:14px;padding:1.5px 0}
  .tt-row .k{color:var(--dim)}
  .tt-row .v{font-weight:600;text-align:right}
  .tt-trade{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.08)}
  .tt-trade .k{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  .tt-trade .v{display:block;font-weight:500;color:#cfe6d8;margin:1px 0 6px}
  .tt-trade .v.imp{color:#e8d6bd;margin-bottom:0}
  .tt-nodata{color:var(--dim);font-style:italic;margin-top:4px}
  @media (max-width:640px){.panel{width:240px}}

  /* ---------- Minen-Ebene ---------- */
  .mine-block{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.09)}
  .mine-block .mb-head{font-size:10px;letter-spacing:.8px;text-transform:uppercase;
    color:var(--dim);margin-bottom:7px;font-weight:600}
  .mtoggle{display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
    border-radius:8px;padding:7px 11px;margin-bottom:6px;font-size:12px;
    cursor:pointer;user-select:none;transition:background .15s;color:#fff}
  .mtoggle:hover{background:rgba(255,255,255,.15)}
  .mtoggle .led{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .15s}
  .mtoggle.on .led{background:#5ce08a;box-shadow:0 0 8px #5ce08a}
  select#mineFilter{width:100%;background-color:rgba(20,30,45,.9);border:1px solid rgba(255,255,255,.2);
    border-radius:8px;padding:7px 11px;color:#fff!important;font-size:12.5px;font-weight:500;
    outline:none;cursor:pointer;margin-bottom:6px}
  select#mineFilter option{background-color:#0d111a;color:#fff}
  #mineCount{font-size:10px;color:var(--dim);text-align:right;margin-bottom:4px}

  #legendHead{font-size:11px;color:var(--dim);cursor:pointer;user-select:none;
    display:flex;align-items:center;gap:6px;padding:3px 0}
  #legendHead:hover{color:#fff}
  #legendHead:before{content:"▸";display:inline-block;transition:transform .15s}
  #legendHead.open:before{transform:rotate(90deg)}
  #mineLegend{display:none;margin-top:6px}
  #mineLegend.open{display:block}
  .lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
  .lg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#cfd8e8;
    padding:2px 4px;border-radius:5px;cursor:pointer}
  .lg-item:hover{background:rgba(255,255,255,.09)}
  .lg-item.on{background:rgba(55,200,232,.18);color:#fff}
  .lg-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lg-item em{font-style:normal;color:var(--dim);font-size:9px}
  .lg-sep{height:1px;background:rgba(255,255,255,.09);margin:7px 0}
  .lg-stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
  .lg-st{display:flex;align-items:center;gap:5px;font-size:10px;color:#cfd8e8}
  .lg-st b{width:7px;height:7px;border-radius:50%;display:inline-block}
  .lg-foot{font-size:9px;color:#70809c;margin-top:8px;line-height:1.45}

  /* ---------- Minen-Dossier ---------- */
  #dossier{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:340px;max-height:78vh;overflow-y:auto;display:none;z-index:30;
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:13px 15px 14px;backdrop-filter:blur(8px);box-shadow:0 14px 44px rgba(0,0,0,.6);
    font-size:11.5px;line-height:1.45;color:#fff}
  .dos-close{position:absolute;top:7px;right:11px;font-size:17px;color:var(--dim);
    cursor:pointer;line-height:1}
  .dos-close:hover{color:#fff}
  .dos-head{display:flex;gap:9px;align-items:center;margin-bottom:9px}
  .dos-icon{width:11px;height:11px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 10px currentColor}
  .dos-name{font-size:14px;font-weight:600}
  .dos-sub{font-size:10.5px;color:var(--dim);margin-top:1px}
  .dos-level{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .dos-lvtag{font-size:10px;font-weight:700;border:1px solid;border-radius:5px;padding:1.5px 6px;
    letter-spacing:.4px;text-transform:uppercase}
  .dos-bars{display:flex;gap:2.5px}
  .dos-bars i{width:13px;height:6px;border-radius:2px;display:inline-block}
  .dos-status{font-size:10.5px;font-weight:600;display:flex;align-items:center;gap:5px;margin-left:auto}
  .dos-status b{width:7px;height:7px;border-radius:50%;display:inline-block}
  .dos-note{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.09);
    font-size:10.5px;color:#b9c6da;font-style:italic}
  .vb-links{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .vb-links a{color:#7fd0ff;text-decoration:none;font-size:12.5px}
  .vb-links a:hover{color:#fff}
  #ucPick,#compPick{margin-bottom:6px}
  #ucBanner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:40;max-width:min(760px,calc(100% - 24px));
    background:rgba(8,14,26,.9);border:1px solid rgba(92,255,176,.45);border-radius:12px;padding:9px 12px;color:#eaf2ff;
    font:13px 'Segoe UI',system-ui,sans-serif;backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #ucBanner .ucb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #ucBanner .ucb-k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5CFFB0}
  #ucBanner .ucb-n{color:#9fb3c8}
  #ucBanner a{color:#5CFFB0;text-decoration:none;font-weight:600}
  #ucBanner .ucb-all{font-size:12px;color:#9fb3c8;cursor:pointer;user-select:none}
  #ucBanner .ucb-all input{vertical-align:-2px;accent-color:#5CFFB0}
  #ucBanner .ucb-x{margin-left:auto;cursor:pointer;font-size:18px;line-height:1;color:#9fb3c8}
  #ucBanner .ucb-nav{display:inline-flex;align-items:center;gap:4px;margin-left:4px}
  #ucBanner .ucb-nav button{background:rgba(92,255,176,.12);border:1px solid rgba(92,255,176,.45);color:#eaf2ff;border-radius:8px;width:34px;height:30px;font-size:13px;cursor:pointer}
  #ucBanner .ucb-nav button:hover{background:rgba(92,255,176,.3)}
  #ucBanner .ucb-pos{min-width:44px;text-align:center;color:#9fb3c8;font-variant-numeric:tabular-nums}
  #ucBanner .ucb-groups{margin-top:9px;max-height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
  #ucBanner .ucb-group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  #ucBanner .ucb-cc{font-size:11.5px;color:#9fb3c8;min-width:118px}
  #ucBanner .ucb-cc i{font-style:normal;color:#5CFFB0;margin-left:3px}
  #ucBanner .ucb-chip{cursor:pointer;padding:6px 12px;border-radius:14px;border:1px solid rgba(92,255,176,.35);background:rgba(92,255,176,.08);color:#eaf2ff;font:13px 'Segoe UI',system-ui,sans-serif}
  #ucBanner .ucb-chip:hover{background:rgba(92,255,176,.25)}
  #ucBanner .ucb-chip.on{background:#5CFFB0;color:#06231a;border-color:#5CFFB0;font-weight:600}
  @media (max-width:640px){ #ucBanner .ucb-cc{min-width:0;width:100%} #ucBanner .ucb-groups{max-height:30vh} }
  #dossier{animation:dosPop .22s cubic-bezier(.2,1.25,.5,1)}
  @keyframes dosPop{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}
                    to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  #dossier::-webkit-scrollbar{width:6px}
  #dossier::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:3px}
  @media (max-width:640px){#dossier{width:calc(100% - 36px);max-height:70vh}}

  .panel{max-height:calc(100vh - 36px);overflow-y:auto;scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.22) transparent}
  .panel::-webkit-scrollbar{width:6px}
  .panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:3px}
  .mtoggle[data-layer="p"].on .led{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .mtoggle[data-layer="d"].on .led{background:#00e5ff;box-shadow:0 0 8px #00e5ff}
  .mtoggle[data-layer="r"].on .led{background:#c98af5;box-shadow:0 0 8px #c98af5}
  .mtoggle[data-layer="e"].on .led{background:#ffd84a;box-shadow:0 0 8px #ffd84a}
  .mtoggle[data-layer="h"].on .led{background:#e8c07a;box-shadow:0 0 8px #e8c07a}
  .mtoggle[data-layer="c"].on .led{background:#ffe1a8;box-shadow:0 0 8px #ffe1a8}

  #panelBtn{display:none;position:fixed;left:12px;top:12px;z-index:45;width:44px;height:44px;
    border-radius:12px;background:var(--panel);border:1px solid var(--panel-border);
    backdrop-filter:blur(8px);cursor:pointer;padding:0;
    flex-direction:column;align-items:center;justify-content:center;gap:4px}
  #panelBtn span{display:block;width:18px;height:2px;border-radius:1px;background:#dbe6f5;
    transition:transform .22s,opacity .22s}
  #panelBtn.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  #panelBtn.open span:nth-child(2){opacity:0}
  #panelBtn.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  #panelScrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(2,6,14,.55);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:35}

  @media (max-width:720px){
    #panelBtn{display:flex}
    #panelScrim{display:block}
    body.panel-open #panelScrim{opacity:1;pointer-events:auto}
    .panel{position:fixed;left:0;top:0;bottom:0;width:min(88vw,340px);max-width:none;
      max-height:none;border-radius:0 16px 16px 0;padding-top:64px;
      transform:translateX(-102%);transition:transform .26s ease;z-index:40}
    body.panel-open .panel{transform:none}
    #dossier{width:calc(100% - 24px);max-height:72vh}
    .no-card{max-height:80vh}
    #newsOverlay{padding:14px}
  }
  @media (max-width:720px) and (orientation:landscape){
    .panel{width:min(70vw,320px)}
  }
  #linkToggle.on .led{background:#ff9d4a;box-shadow:0 0 8px #ff9d4a}
  .lg-item canvas{flex:0 0 auto}
  #layerPanel select{width:100%;background-color:rgba(20,30,45,.9);border:1px solid rgba(255,255,255,.2);
    border-radius:8px;padding:7px 11px;color:#fff!important;font-size:12.5px;font-weight:500;
    outline:none;cursor:pointer;margin-bottom:6px}
  #layerPanel select option{background-color:#0d111a;color:#fff}
  #siteCount{font-size:10px;color:var(--dim);text-align:right;margin-top:8px;line-height:1.6}
  .dos-links{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.09)}
  .dos-lh{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .dos-link{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#c8d4e6;padding:1px 0}
  .dos-link b{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .dos-geo{margin-top:9px;font-family:ui-monospace,Consolas,monospace;font-size:10px;
    color:#8fa8c8;cursor:pointer;letter-spacing:.2px}
  .dos-geo:hover{color:#fff}
  .dos-geo.copied{color:#5ce08a}
  .dos-id{opacity:.55;margin-left:6px}
  .dos-ev{font-size:10.5px;line-height:1.45;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .dos-ev:last-child{border-bottom:none}
  .dos-evd{color:#ffd66e;font-family:ui-monospace,Consolas,monospace;font-size:9.5px;margin-right:6px}
  .dos-ev a{color:#cfe2ff;text-decoration:none;border-bottom:1px solid rgba(207,226,255,.3)}
  .dos-ev a:hover{color:#fff}
  .dos-ev em{display:block;font-style:normal;color:var(--dim);font-size:9px;margin-top:1px}
  #geoSearch{width:100%;background:rgba(20,30,45,.9);border:1px solid rgba(255,255,255,.2);
    border-radius:8px;padding:7px 11px;color:#fff;font-size:12px;outline:none;margin-bottom:6px;
    font-family:inherit}
  #geoSearch:focus{border-color:var(--accent)}
  #geoSearch::placeholder{color:#6f7f97}
  .btn-row{display:flex;gap:6px;margin-bottom:6px}
  .btn-row button{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:8px;padding:6px 4px;color:#fff;font-size:11px;font-family:inherit;
    cursor:pointer;transition:background .15s}
  .btn-row button:hover{background:rgba(255,255,255,.18)}
  .btn-row button.wide{flex:1 1 100%}
  #evToggle.on .led,#evOnly.on .led{background:#ffd66e;box-shadow:0 0 8px #ffd66e}

  .acc{border-bottom:1px solid rgba(255,255,255,.07)}
  .acc:last-of-type{border-bottom:none}
  .acc-head{display:flex;align-items:center;gap:9px;padding:9px 2px;cursor:pointer;user-select:none}
  .acc-head:hover .acc-name{color:#fff}
  .acc-arrow{width:9px;height:9px;flex:0 0 auto;position:relative}
  .acc-arrow:before{content:"";position:absolute;left:1px;top:1px;width:5px;height:5px;
    border-right:1.6px solid #7f8fa8;border-bottom:1.6px solid #7f8fa8;
    transform:rotate(-45deg);transition:transform .18s}
  .acc.open .acc-arrow:before{transform:rotate(45deg);border-color:#cfe2ff}
  .acc-name{flex:1;font-size:12.5px;font-weight:600;color:#d5e0f0;transition:color .15s}
  .acc.open .acc-name{color:#fff}
  .acc-count{font-size:10px;color:#6f7f97;font-variant-numeric:tabular-nums}
  .acc-body{display:none;padding:2px 0 12px 18px}
  .acc.open .acc-body{display:block;animation:accIn .18s ease}
  @keyframes accIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .acc-body .toggle{margin-bottom:5px}

  .sw{width:30px;height:16px;border-radius:9px;flex:0 0 auto;cursor:pointer;position:relative;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.14);transition:background .16s}
  .sw:before{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;
    background:#8b98ab;transition:transform .16s,background .16s}
  .sw.on{background:rgba(92,224,138,.28);border-color:rgba(92,224,138,.5)}
  .sw.on:before{transform:translateX(14px);background:#5ce08a}
  .sw:hover{border-color:rgba(255,255,255,.35)}
  #bubbleToggle.on .led{background:#bde9ff;box-shadow:0 0 9px #bde9ff}

  #newsOverlay{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;background:rgba(3,7,14,.62);
    backdrop-filter:blur(6px);padding:24px}
  #newsOverlay.open{display:flex}
  .no-card{position:relative;width:min(560px,100%);max-height:86vh;overflow-y:auto;
    background:linear-gradient(160deg,rgba(18,26,40,.97),rgba(11,16,26,.97));
    border:1px solid rgba(140,190,240,.25);border-radius:16px;padding:26px 28px 22px;
    box-shadow:0 30px 90px rgba(0,0,0,.65);color:#fff;
    animation:noPop .28s cubic-bezier(.2,1.3,.5,1)}
  @keyframes noPop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .no-x{position:absolute;top:12px;right:16px;font-size:22px;line-height:1;color:var(--dim);cursor:pointer}
  .no-x:hover{color:#fff}
  .no-top{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
  .no-kind{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
    color:#0b1220;border-radius:5px;padding:2.5px 8px}
  .no-date{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;color:#ffd66e}
  .no-src{font-size:10.5px;color:var(--dim)}
  .no-title{font-size:20px;line-height:1.3;font-weight:600;margin:0 0 12px}
  .no-sum{font-size:13px;line-height:1.65;color:#cfdcee;margin:0 0 18px}
  .no-site{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:10px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);margin-bottom:16px}
  .no-site .dos-icon{margin-top:3px}
  .no-sname{font-size:13.5px;font-weight:600}
  .no-ssub{font-size:11px;color:var(--dim);margin-top:2px}
  .no-sgeo{font-family:ui-monospace,Consolas,monospace;font-size:9.5px;color:#7d90ad;margin-top:3px}
  .no-actions{display:flex;gap:9px;flex-wrap:wrap}
  .no-btn{flex:1;min-width:150px;text-align:center;text-decoration:none;font-family:inherit;
    font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:9px;cursor:pointer;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#fff;
    transition:background .15s}
  .no-btn:hover{background:rgba(255,255,255,.18)}
  .no-btn.primary{background:var(--accent);border-color:var(--accent);color:#04121a}
  .no-btn.primary:hover{background:#5fd8f2}
  @media (max-width:640px){.no-card{padding:22px 18px 18px}.no-title{font-size:17px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="globe"></canvas>

<div id="panelScrim"></div>

/* Hilfsfunktion zur Übersetzung der Regionen */
function translateRegion(regionStr) {
  if (currentLang === 'en') return regionStr;
  return regionStr
    .replace("Americas", "Amerika").replace("Northern America", "Nordamerika")
    .replace("Central America", "Zentralamerika").replace("South America", "Südamerika").replace("Caribbean", "Karibik")
    .replace("Europe", "Europa").replace("Northern Europe", "Nordeuropa").replace("Western Europe", "Westeuropa")
    .replace("Southern Europe", "Südeuropa").replace("Eastern Europe", "Osteuropa")
    .replace("Asia", "Asien").replace("Western Asia", "Westasien").replace("Central Asia", "Zentralasien")
    .replace("Southern Asia", "Südasien").replace("South-Eastern Asia", "Südostasien").replace("Eastern Asia", "Ostasien")
    .replace("Africa", "Afrika").replace("Northern Africa", "Nordafrika").replace("Western Africa", "Westafrika")
    .replace("Middle Africa", "Zentralafrika").replace("Eastern Africa", "Ostafrika").replace("Southern Africa", "Südafrika")
    .replace("Oceania", "Ozeanien").replace("Australia & NZ", "Australien & NZ").replace("Melanesia", "Melanesien");
}

/* Hilfsfunktion zur Formatierung der Volumina (Mio. t -> M tonnes etc.) */
function translateVolume(volStr) {
  if (!volStr) return "";
  if (currentLang === 'de') return volStr;
  // Übersetzt deutsche Einheiten ins Englische
  return volStr.replace("Mio. t", "M tonnes")
               .replace("Mrd. $", "B $")
               .replace("Karat", "carats")
               .replace(" t", " tonnes")
               .replace("Mio. m³", "M m³");
}

/* Funktion um die UI-Sprache zu wechseln */

  currentLang = lang;
  document.getElementById('btn-en').className = lang === 'en' ? 'active' : '';
  document.getElementById('btn-de').className = lang === 'de' ? 'active' : '';
  
  const t = i18n[lang];
  document.getElementById('ui-title').innerText = t.title;
  document.getElementById('ui-hint').innerText = t.hint;
  document.getElementById('ui-borders').innerText = t.borders;
  document.getElementById('ui-grid').innerText = t.grid;
  document.getElementById('ui-night').innerText = t.night;
  document.getElementById('ui-rotate').innerText = t.rotate;
  document.getElementById('ui-credit').innerText = t.credit;

  // Dropdown neu generieren (behält den ausgewählten Wert bei)
  const select = document.getElementById("resourceFilter");
  const currentVal = select.value;
  select.innerHTML = `
    <option value="">${t.filterDefault}</option>
    <optgroup label="${t.groupEnergy}">
      <option value="Crude oil">${t.res["Crude oil"]}</option>
      <option value="Natural gas">${t.res["Natural gas"]}</option>
      <option value="Coal">${t.res["Coal"]}</option>
      <option value="Copper">${t.res["Copper"]}</option>
      <option value="Gold">${t.res["Gold"]}</option>
      <option value="Iron ore">${t.res["Iron ore"]}</option>
    </optgroup>
    <optgroup label="${t.groupAgri}">
      <option value="Wheat">${t.res["Wheat"]}</option>
      <option value="Soybeans">${t.res["Soybeans"]}</option>
      <option value="Coffee">${t.res["Coffee"]}</option>
      <option value="Palm oil">${t.res["Palm oil"]}</option>
      <option value="Wood">${t.res["Wood"]}</option>
      <option value="Fish">${t.res["Fish"]}</option>
    </optgroup>
    <optgroup label="${t.groupInd}">
      <option value="Integrated circuits">${t.res["Integrated circuits"]}</option>
      <option value="Fertilizers">${t.res["Fertilizers"]}</option>
      <option value="Diamonds">${t.res["Diamonds"]}</option>
    </optgroup>
  `;
  select.value = currentVal;
  
  // Wenn gerade ein Tooltip offen ist, render() aufrufen, um ihn zu übersetzen
  if (hovered >= 0) {
    showTooltip(countries[hovered], lastPointer ? lastPointer[0] : 0, lastPointer ? lastPointer[1] : 0);

}

const fmt = n => n.toLocaleString(currentLang === 'de' ? "de-DE" : "en-US");
const flagEmoji = iso2 => iso2.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
function popStr(m){ 
  const suffix = currentLang === 'de' ? ' Millionen' : ' million';
  return m >= 1 ? m.toLocaleString(currentLang === 'de' ? "de-DE" : "en-US",{maximumFractionDigits:1}) + suffix : fmt(Math.round(m*1e6)); 
}
function gdpStr(b){ 
  const tril = currentLang === 'de' ? 'Billionen' : 'trillion';
  const bil = currentLang === 'de' ? 'Milliarden' : 'billion';
  const loc = currentLang === 'de' ? 'de-DE' : 'en-US';
  return b >= 1000 ? "$" + (b/1000).toLocaleString(loc,{maximumFractionDigits:2}) + " " + tril : "$" + b.toLocaleString(loc,{maximumFractionDigits:1}) + " " + bil; 
}

const globeCv = document.getElementById("globe");
const starCv  = document.getElementById("stars");
const tooltip = document.getElementById("tooltip");
const ctx = globeCv.getContext("2d");
const pickCv = document.createElement("canvas");
const pctx = pickCv.getContext("2d", {willReadFrequently:true});

const state = { borders:true, graticule:false, night:false, rotate:false, relief:false, aiOnly:false };
let W, H, DPR, scale, rotation = [-95, -22], hovered = -1, dragging = false, lastPointer = null, needsPick = true;

const topo = Datamap.prototype.worldTopo;
const countries = topojson.feature(topo, topo.objects.world).features;
countries.forEach((f,i)=>{ f._i = i; f._pick = `rgb(${(i+1)&255},${((i+1)>>8)&255},40)`; });

const projection = d3.geo.orthographic().clipAngle(90);
const path  = d3.geo.path().projection(projection).context(ctx);
const ppath = d3.geo.path().projection(projection).context(pctx);
const graticule = d3.geo.graticule().step([20,20]);

let currentFilter = "";

function landColor(f, hover){
  const s = f.id || String(f._i);
  const rec = DATA[f.id];

  if (currentFilter !== "") {
    if (rec) {
      const exports = rec[5].toLowerCase().split(',').map(x => x.trim()); 
      const search = currentFilter.toLowerCase();
      const exportIndex = exports.findIndex(item => item.includes(search));
      
      if (exportIndex !== -1) {
        const intensity = 1 - (exportIndex / Math.max(exports.length, 1));
        const lightness = 25 + (intensity * 40) + (hover ? 12 : 0);
        return `hsl(120, 80%, ${lightness}%)`; 
      } else {
        return hover ? "rgba(25, 55, 30, 0.8)" : "rgba(10, 25, 12, 0.7)";
      }
    } else {
      return "rgba(10, 25, 12, 0.7)";
    }
  }

  let h = 0; 
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  const hue = 70 + (h % 45), sat = 24 + (h % 14), lit = 33 + (h % 11);
  return hover ? `hsl(${hue},${sat+18}%,${lit+16}%)` : `hsl(${hue},${sat}%,${lit}%)`;
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [globeCv, starCv]){ c.width = W*DPR; c.height = H*DPR; c.style.width = W+"px"; c.style.height = H+"px"; }
  pickCv.width = W; pickCv.height = H;
  if (!scale) scale = Math.min(W,H)/2.25;
  drawStars(); needsPick = true; render();
}

function drawStars(){
  const s = starCv.getContext("2d");
  s.setTransform(DPR,0,0,DPR,0,0);
  s.fillStyle = "#04060c"; s.fillRect(0,0,W,H);
  let seed = 7;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for (let i=0;i<Math.floor(W*H/2800);i++){
    const x = rnd()*W, y = rnd()*H, r = rnd()*1.1+0.15, a = rnd()*0.7+0.15;
    s.fillStyle = `rgba(${200+rnd()*55|0},${210+rnd()*45|0},255,${a})`;
    s.beginPath(); s.arc(x,y,r,0,7); s.fill();
  }
}

function antiSolar(){
  const rad = Math.PI/180, D = (Date.now() - Date.UTC(2000,0,1,12)) / 864e5;
  const g = (357.529 + 0.98560028*D) * rad;
  const q = 280.459 + 0.98564736*D;
  const L = (q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * rad;
  const e = (23.439 - 3.6e-7*D) * rad;
  const decl = Math.asin(Math.sin(e)*Math.sin(L)) / rad;
  const RA = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L)) / rad;
  const GMST = (280.46061837 + 360.98564736629*D) % 360;
  let sunLon = ((RA - GMST) % 360 + 540) % 360 - 180;
  let aLon = sunLon + 180; if (aLon > 180) aLon -= 360;
  return [aLon, -decl];
}

function render(){
  projection.rotate(rotation).scale(scale).translate([W/2, H/2]);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const cx = W/2, cy = H/2;

  let glow = ctx.createRadialGradient(cx,cy,scale*0.95, cx,cy,scale*1.12);
  glow.addColorStop(0,"rgba(80,160,255,0.28)"); glow.addColorStop(1,"rgba(80,160,255,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx,cy,scale*1.12,0,7); ctx.fill();

  let oc = ctx.createRadialGradient(cx-scale*0.35, cy-scale*0.4, scale*0.1, cx, cy, scale);
  oc.addColorStop(0,"#3f7fb8"); oc.addColorStop(0.55,"#2a5d96"); oc.addColorStop(1,"#11304f");
  ctx.fillStyle = oc; ctx.beginPath(); ctx.arc(cx,cy,scale,0,7); ctx.fill();

  if (state.graticule){
    ctx.beginPath(); path(graticule());
    ctx.strokeStyle = "rgba(180,210,255,0.14)"; ctx.lineWidth = 0.5; ctx.stroke();
  }

  if (typeof drawReliefLayer === "function") drawReliefLayer();

  const reliefOn = (typeof relief !== "undefined") && state.relief && relief.ready;
  for (const f of countries){
    ctx.beginPath(); path(f);
    if (!reliefOn){
      ctx.fillStyle = landColor(f, f._i === hovered); ctx.fill();
    } else if (currentFilter !== ""){
      ctx.save(); ctx.globalAlpha = 0.45;
      ctx.fillStyle = landColor(f, f._i === hovered); ctx.fill(); ctx.restore();
    } else if (f._i === hovered){
      ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.restore();
    }
    if (state.borders){
      ctx.strokeStyle = reliefOn ? "rgba(235,245,255,0.45)" : "rgba(230,240,255,0.35)";
      ctx.lineWidth = 0.55; ctx.stroke();
    }
  }
  if (hovered >= 0){
    ctx.beginPath(); path(countries[hovered]);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.4; ctx.stroke();
  }

  if (state.night){
    const night = d3.geo.circle().origin(antiSolar()).angle(89)();
    ctx.beginPath(); path(night);
    ctx.fillStyle = "rgba(2,6,20,0.5)"; ctx.fill();
  }

  let limb = ctx.createRadialGradient(cx,cy,scale*0.78, cx,cy,scale);
  limb.addColorStop(0,"rgba(0,0,0,0)"); limb.addColorStop(1,"rgba(0,0,30,0.42)");
  ctx.fillStyle = limb; ctx.beginPath(); ctx.arc(cx,cy,scale,0,7); ctx.fill();
}

function renderPick(){
  projection.rotate(rotation).scale(scale).translate([W/2, H/2]);
  pctx.setTransform(1,0,0,1,0,0);
  pctx.clearRect(0,0,W,H);
  for (const f of countries){
    pctx.beginPath(); ppath(f);
    pctx.fillStyle = f._pick; pctx.fill();
  }
  needsPick = false;
}

function pick(x,y){
  if (needsPick) renderPick();
  const d = pctx.getImageData(x,y,1,1).data;
  if (d[3] === 0) return -1;
  return (d[0] | (d[1]<<8)) - 1;
}

function showTooltip(f, x, y){
  const rec = DATA[f.id];
  const name = rec ? rec[0] : (f.properties && f.properties.name) || f.id;
  const t = i18n[currentLang];
  let html;
  
  if (rec){
    const [n,region,area,pop,gdp,exp,imp,iso2, volumes = {}] = rec;
    const perCap = Math.round(gdp*1e9 / (pop*1e6));

    let filterInfo = "";
    if (currentFilter !== "") {
      const expList = exp.toLowerCase().split(',').map(s => s.trim());
      const searchKey = currentFilter.toLowerCase();
      const rank = expList.findIndex(item => item.includes(searchKey)) + 1;

      if (rank > 0) {
        let volumeText = volumes[searchKey] || t.ttNoVol;
        volumeText = translateVolume(volumeText);
        
        filterInfo = `
          <div class="tt-row" style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.15);">
            <span class="k" style="color: var(--accent); font-weight: 600;">${t.res[currentFilter]}</span>
            <span class="v" style="color: #5cedff;">${t.ttRank} #${rank} &bull; ${volumeText}</span>
          </div>`;
      } else {
        filterInfo = `
          <div class="tt-row" style="margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.15);">
            <span class="k">${t.res[currentFilter]}</span>
            <span class="v" style="color: rgba(255,255,255,0.3); font-weight: 400;">${t.ttNotInTop}</span>
          </div>`;
      }
    }

    html = `<div class="tt-name"><span>${flagEmoji(iso2)}</span>${n}</div>
      <div class="tt-region">${translateRegion(region)}</div>
      <div class="tt-row"><span class="k">${t.ttArea}</span><span class="v">${fmt(area)} km²</span></div>
      <div class="tt-row"><span class="k">${t.ttPop}</span><span class="v">${popStr(pop)}</span></div>
      <div class="tt-row"><span class="k">${t.ttGdp}</span><span class="v">${gdpStr(gdp)}</span></div>
      <div class="tt-row"><span class="k">${t.ttGdpCap}</span><span class="v">$${fmt(perCap)}</span></div>
      ${filterInfo}
      <div class="tt-trade">
        <span class="k">${t.ttExp}</span><span class="v">${exp}</span>
        <span class="k">${t.ttImp}</span><span class="v imp">${imp}</span>
      </div>`;
  } else {
    html = `<div class="tt-name">${name}</div><div class="tt-nodata">${t.ttNoData}</div>`;
  }
  
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  const r = tooltip.getBoundingClientRect();
  let tx = x + 18, ty = y + 18;
  if (tx + r.width > W - 12) tx = x - r.width - 18;
  if (ty + r.height > H - 12) ty = y - r.height - 18;
  tooltip.style.left = Math.max(8,tx) + "px";
  tooltip.style.top  = Math.max(8,ty) + "px";
}
function hideTooltip(){ tooltip.style.display = "none"; }

globeCv.addEventListener("pointerdown", e => {
  dragging = true; lastPointer = [e.clientX, e.clientY];
  globeCv.classList.add("dragging"); globeCv.setPointerCapture(e.pointerId);
});
globeCv.addEventListener("pointerup", e => {
  dragging = false; globeCv.classList.remove("dragging");
});
globeCv.addEventListener("pointermove", e => {
  const x = e.clientX, y = e.clientY;
  if (dragging && lastPointer){
    const k = 0.25 * (Math.min(W,H)/2.25) / scale;
    rotation[0] += (x - lastPointer[0]) * k;
    rotation[1] -= (y - lastPointer[1]) * k;
    rotation[1] = Math.max(-89, Math.min(89, rotation[1]));
    lastPointer = [x,y]; needsPick = true; hovered = -1; hideTooltip(); render();
    return;
  }
  const i = pick(x,y);
  if (i !== hovered){ hovered = i; render(); }
  if (i >= 0) showTooltip(countries[i], x, y); else hideTooltip();
});
globeCv.addEventListener("pointerleave", () => { hovered = -1; hideTooltip(); render(); });
globeCv.addEventListener("wheel", e => {
  e.preventDefault();
  scale *= e.deltaY < 0 ? 1.12 : 0.89;
  scale = Math.max(120, Math.min(Math.min(W,H)*3.2, scale));
  needsPick = true; render();
  const i = pick(e.clientX, e.clientY);
  if (i !== hovered){ hovered = i; render(); }
  if (i >= 0) showTooltip(countries[i], e.clientX, e.clientY); else hideTooltip();
}, {passive:false});

document.querySelectorAll(".toggle").forEach(t => {
  t.addEventListener("click", () => {
    const k = t.dataset.key;
    state[k] = !state[k];
    t.classList.toggle("on", state[k]);
    render();
  });
});

document.getElementById("resourceFilter").addEventListener("change", (e) => {
  currentFilter = e.target.value;
  render();
});

let lastT = performance.now();
function tick(t){
  const dt = t - lastT; lastT = t;
  if (state.rotate && !dragging && hovered < 0){
    rotation[0] += dt * 0.004;
    needsPick = true; render();
  } else if (state.night){
    // keep terminator fresh
  }
  requestAnimationFrame(tick);
}

function findSite(n){

function ucPlaces(u){

function ucBanner(){

  if (!UC_SEL){ if (b) b.remove(); return; }

  const groups = [];
  if (UC_SEL.groups) UC_SEL.groups.forEach(g => groups.push({label:g.label, items:g.items}));
  else ps.forEach((p, i) => {
    let g = groups.find(x => x.c === p.c);
    if (!g){ g = {c:p.c, items:[]}; groups.push(g); }

      <a href="${UC_SEL.back || (UC_BOARD + "#uc=" + UC_SEL.slug)}" target="_blank" rel="noopener">${UC_SEL.backLabel ? (L()?UC_SEL.backLabel.de:UC_SEL.backLabel.en) : (L()?"Karte öffnen":"Open card")} ↗</a>
      <label class="ucb-all"><input type="checkbox" ${UC_SHOWALL?"checked":""}> ${L()?"Alle Standorte zeigen":"Show all sites"}</label>
      <span class="ucb-x" title="${L()?"Schließen":"Close"}">×</span></div>
    <div class="ucb-groups">${groups.map(g => `<div class="ucb-group"><span class="ucb-cc">${g.label ? (L()?g.label.de:g.label.en) : siteFlag(g)+" "+siteCountry(g)} <i>${g.items.length}</i></span>${g.items.map(i => `<button class="ucb-chip${i===UC_IDX?" on":""}" data-i="${i}" title="${siteCountry(ps[i])}">${g.label ? siteFlag(ps[i])+" " : ""}${ps[i].n}</button>`).join("")}</div>`).join("")}</div>`;
  b.querySelector(".ucb-x").onclick = () => {
    UC_SEL = null; UC_FOCUS = null; UC_IDX = -1; UC_SHOWALL = false; ucBanner(); ucSetUrl(); fillVerbund();
    document.getElementById("dossier").style.display = "none"; selectedSite = null; render();

  b.querySelector(".ucb-prev").onclick = () => ucGo(UC_IDX < 0 ? ps.length - 1 : UC_IDX - 1);

window.addEventListener("keydown", e => {
  if (!UC_SEL || /INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||"")) return;
  if (e.key === "ArrowRight"){ ucGo(UC_IDX + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft"){ ucGo(UC_IDX < 0 ? UC_SEL.places.length - 1 : UC_IDX - 1); e.preventDefault(); }
});
function drawUcPoints(){
  ucVisible = [];
  if (!UC_SEL) return;
  for (const p of UC_SEL.places){
    if (p.site) continue;
    if (!onFront(p.lo, p.la)) continue;
    const q = projection([p.lo, p.la]); if (!q) continue;
    const r = 6.5, x = q[0], y = q[1], hov = ucHover === p;
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r*2.4, 0, 7); ctx.fillStyle = "rgba(92,255,176,0.16)"; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y-r); ctx.lineTo(x+r, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r, y); ctx.closePath();
    ctx.fillStyle = "#5CFFB0"; ctx.fill(); ctx.lineWidth = hov ? 2 : 1.2; ctx.strokeStyle = hov ? "#ffffff" : "rgba(6,10,18,0.9)"; ctx.stroke();
    ctx.font = "600 10.5px 'Segoe UI',system-ui,sans-serif"; ctx.textAlign = "center";
    const tw = ctx.measureText(p.n).width;
    ctx.fillStyle = "rgba(4,8,16,0.75)"; ctx.fillRect(x - tw/2 - 4, y - r - 18, tw + 8, 14);
    ctx.fillStyle = "#eaf2ff"; ctx.fillText(p.n, x, y - r - 7.5);
    ctx.restore();
    ucVisible.push({p, x, y, r});
  }
}
function pickUc(x, y){
  for (const it of ucVisible) if (Math.hypot(x - it.x, y - it.y) <= it.r + 6) return it.p;
  return null;
}

function ucSetUrl(k, v){
  const q = new URLSearchParams(location.search);
  q.delete("uc"); q.delete("company"); if (k) q.set(k, v);
  const qs = q.toString(); history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));

function compOpen(comp){
  if (!UC_COMP || !(UC_COMP.operators[comp] || (UC_COMP.relations||{})[comp])) return false;
  const frags = UC_COMP.operators[comp] || [], nm = UC_COMP.names[comp] || comp;
  const all = [MINES,PLANTS,DCS,PROC,POWER,HUBS,MEM].flat();
  const toPlace = x => ({n:x.n, c:x.c, la:x.la, lo:x.lo, en:(x.aiu||{}).en||"", de:(x.aiu||{}).de||"", src:(x.aiu||{}).src||"", yr:(x.aiu||{}).yr||"", site:x});
  /* Rollen: betreibt (Betreiberfeld) plus Lieferkette und Kunden aus deployments.json.
     Eine ausdrücklich eingetragene Rolle geht vor dem Textabgleich im Betreiberfeld,
     sonst stünde z. B. Nvidia als Betreiber eines Rechenzentrums, in dem nur seine GPUs laufen. */
  const roles = [];
  const seen = new Set();
  const rel = (UC_COMP.relations||{})[comp] || [];
  const named = new Set(rel.flatMap(r => r.sites));
  const own = all.filter(x => x.ow && frags.some(f => x.ow.includes(f)) && !named.has(x.n));
  if (own.length) roles.push({role:"operates", sites:own});
  for (const r of rel){
    const ss = r.sites.map(findSite).filter(Boolean);
    if (ss.length) roles.push({role:r.role, sites:ss});
  }
  const places = [], groups = [];
  for (const r of roles){
    const idx = [];
    for (const x of r.sites){ if (seen.has(x.n)) continue; seen.add(x.n); idx.push(places.length); places.push(toPlace(x)); }
    if (idx.length) groups.push({label:(UC_COMP.roles||{})[r.role] || {en:r.role, de:r.role}, items:idx});
  }
  if (!places.length) return false;
  UC_SEL = {slug: "", kindLabel: {en:"Company", de:"Firma"}, u: {name:{en: nm, de: nm}}, places, groups,
            back: UC_COMP.page + "#/" + (L()?"de":"en") + "/" + comp, backLabel: {en:"Market figures", de:"Börsen-Kennzahlen"}};
  UC_FOCUS = new Set(places.map(p => p.n));
  UC_IDX = -1; ucBanner();
  ucFlyTo(places[0]);
  return true;
}
function ucOpen(want){
  if (!UC_ALL || !UC_ALL[want]) return false;
  const u = UC_ALL[want];
  UC_SEL = {slug: want, u, places: ucPlaces(u)};
  UC_FOCUS = new Set(UC_SEL.places.filter(p => p.site).map(p => p.site.n));
  UC_IDX = -1; ucBanner();
  if (UC_SEL.places.length) ucFlyTo(UC_SEL.places[0]);
  return true;
}
fetch(UC_DEP_URL).then(r => r.ok ? r.json() : null).then(d => {
  if (!d || !d.use_cases) return;
  UC_ALL = d.use_cases;
  UC_COMP = d.companies || null;
  UC_WIKI = d.wiki || null;
  for (const slug in UC_ALL){
    const u = UC_ALL[slug];
    for (const p of u.places) if (p.site) (SITE_UC[p.site] = SITE_UC[p.site] || []).push({slug, u});
  }
  for (const k in ((UC_COMP||{}).relations || {}))
    for (const r of UC_COMP.relations[k]) for (const n of r.sites) (SITE_REL[n] = SITE_REL[n] || []).push({k, role:r.role});
  const comp = UC_PARAMS.get("company");
  if (comp) compOpen(comp);
  const want = UC_PARAMS.get("uc");
  if (want) ucOpen(want);
  fillVerbund();

/* ==========================================================================
   RELIEF
   Eine schattierte Höhenkarte wird pixelweise auf die Kugel zurückprojiziert.
   Beim Drehen wird grob gerechnet, im Stillstand einmal fein nachgezogen.
   Der Ozean bleibt durchsichtig, darunter liegt der vorhandene Wasserverlauf.
   ========================================================================== */

const relief = {ready:false, levels:[], buf:null, bctx:null, fineTimer:0, lvl:0};

(function loadRelief(){
  const img = new Image();
  img.onload = function(){
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const cc = c.getContext("2d", {willReadFrequently:true});
    cc.drawImage(img, 0, 0);
    try {
      /* Detailstufen: jede halb so fein wie die vorige.
         Herausgezoomt wird eine grobe Stufe abgetastet, das nimmt das
         Flimmern und spart Rechenzeit; hineingezoomt die volle Auflösung. */
      let cur = c, cw = c.width, ch = c.height;
      for (let i = 0; i < 5; i++){
        const cx2 = (i === 0) ? cur : document.createElement("canvas");
        if (i > 0){
          cx2.width = cw; cx2.height = ch;
          const g = cx2.getContext("2d", {willReadFrequently:true});
          g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
          g.drawImage(cur, 0, 0, cw, ch);
        }
        const g2 = cx2.getContext("2d", {willReadFrequently:true});
        relief.levels.push({px:g2.getImageData(0,0,cw,ch).data, w:cw, h:ch});
        if (cw <= 300) break;
        cur = cx2; cw = Math.max(2, cw >> 1); ch = Math.max(1, ch >> 1);
      }
      relief.ready = true;
      if (typeof W === "number" && W) render();
    } catch(e){ relief.ready = false; relief.levels = []; }
  };
  img.onerror = function(){ relief.ready = false; };
  img.src = RELIEF_IMG;
})();

/* Auflösung des Reliefpuffers je nach Bewegung.
   q ist die Anzahl gerechneter Pixel je CSS-Pixel: beim Drehen grob,
   im Stillstand bis zur Gerätedichte, gedeckelt auf 1,3 Mio. Punkte. */
function reliefQuality(area){
  const moving = dragging || (state.rotate && hovered < 0 && !hoveredSite && !selectedSite);
  /* Im Stillstand bis zur vollen Gerätedichte rechnen, damit der Puffer nicht
     hochskaliert werden muss. Das war bisher die halbe Unschärfe beim Zoomen. */
  const dpr = Math.min(DPR || 1, 2);
  const budget = moving ? 1.3e5 : Math.min(2.2e6, area*dpr*dpr + 1);
  let q = moving ? 0.34 : dpr;
  const cap = Math.sqrt(budget / Math.max(area, 1));
  if (q > cap) q = cap;
  return Math.max(0.1, q);
}

function drawReliefLayer(){
  if (!state.relief || !relief.ready) return;
  const R = scale, cx = W/2, cy = H/2;
  /* nur den Ausschnitt rechnen, der wirklich im Fenster liegt */
  const bx0 = Math.max(0, Math.floor(cx - R)), bx1 = Math.min(W, Math.ceil(cx + R));
  const by0 = Math.max(0, Math.floor(cy - R)), by1 = Math.min(H, Math.ceil(cy + R));
  const bw = bx1 - bx0, bh = by1 - by0;
  if (bw < 2 || bh < 2) return;
  const q = reliefQuality(bw * bh);
  const sw = Math.max(2, Math.round(bw*q)), sh = Math.max(2, Math.round(bh*q));
  const step = 1/q;

  if (!relief.buf){
    relief.buf = document.createElement("canvas");
    relief.bctx = relief.buf.getContext("2d");
  }
  if (relief.buf.width !== sw || relief.buf.height !== sh){
    relief.buf.width = sw; relief.buf.height = sh;
  }

  /* Detailstufe wählen: wie viele Texturpunkte fallen auf einen gerechneten Punkt? */
  const base = relief.levels[0];
  const texPerPx = (base.w / (2*Math.PI)) / Math.max(R*q, 1);
  let li = Math.floor(Math.log(Math.max(texPerPx, 1)) / Math.LN2 + 0.3);
  if (li < 0) li = 0;
  if (li > relief.levels.length - 1) li = relief.levels.length - 1;
  relief.lvl = li;
  const lev = relief.levels[li];

  const sharp = (li === 0) && (texPerPx < 0.85) && q > 0.5;   /* nur beim Vergrößern lohnt bikubisch */
  const out = relief.bctx.createImageData(sw, sh);
  const o = out.data, px = lev.px, tw = lev.w, th = lev.h;
  const rad = Math.PI/180;
  const l0 = -rotation[0]*rad, p0 = -rotation[1]*rad;
  const sinp0 = Math.sin(p0), cosp0 = Math.cos(p0);
  const TAU = Math.PI*2;

  for (let j = 0; j < sh; j++){
    const y = -((by0 + (j + 0.5)*step) - cy)/R;
    const y2 = y*y;
    for (let i = 0; i < sw; i++){
      const x = ((bx0 + (i + 0.5)*step) - cx)/R;
      const rho2 = x*x + y2;
      if (rho2 > 1) continue;
      const rho = Math.sqrt(rho2);
      const cosc = Math.sqrt(1 - rho2);
      let lat, lon;
      if (rho < 1e-9){ lat = p0; lon = l0; }
      else {
        lat = Math.asin(cosc*sinp0 + y*rho*cosp0/rho);
        lon = l0 + Math.atan2(x*rho, rho*cosc*cosp0 - y*rho*sinp0);
      }
      let u = lon/TAU + 0.5;
      u -= Math.floor(u);
      const fx = u*tw - 0.5, fy = (0.5 - lat/Math.PI)*th - 0.5;
      if (sharp){
        /* bikubisch (Catmull-Rom): deutlich knackiger als bilinear beim Vergrößern */
        const gx0 = Math.floor(fx), gy0 = Math.floor(fy);
        const tx = fx - gx0, ty = fy - gy0;
        const wx0 = ((-0.5*tx + 1)*tx - 0.5)*tx, wx1 = (( 1.5*tx - 2.5)*tx      )*tx + 1;
        const wx2 = ((-1.5*tx + 2)*tx + 0.5)*tx, wx3 = (( 0.5*tx - 0.5)*tx      )*tx;
        const wy0 = ((-0.5*ty + 1)*ty - 0.5)*ty, wy1 = (( 1.5*ty - 2.5)*ty      )*ty + 1;
        const wy2 = ((-1.5*ty + 2)*ty + 0.5)*ty, wy3 = (( 0.5*ty - 0.5)*ty      )*ty;
        const wxs = [wx0,wx1,wx2,wx3], wys = [wy0,wy1,wy2,wy3];
        let cr = 0, cg = 0, cb = 0, ca = 0;
        for (let n = 0; n < 4; n++){
          let yy = gy0 - 1 + n;
          if (yy < 0) yy = 0; else if (yy > th-1) yy = th-1;
          const row = yy*tw, wy = wys[n];
          if (!wy) continue;
          for (let mIdx = 0; mIdx < 4; mIdx++){
            let xx = (gx0 - 1 + mIdx) % tw; if (xx < 0) xx += tw;
            const wgt = wxs[mIdx]*wy;
            if (!wgt) continue;
            const k = (row + xx) << 2;
            cr += px[k]*wgt; cg += px[k+1]*wgt; cb += px[k+2]*wgt; ca += px[k+3]*wgt;
          }
        }
        if (ca < 4) continue;
        const di2 = (j*sw + i) << 2;
        o[di2]   = cr < 0 ? 0 : cr > 255 ? 255 : cr;
        o[di2+1] = cg < 0 ? 0 : cg > 255 ? 255 : cg;
        o[di2+2] = cb < 0 ? 0 : cb > 255 ? 255 : cb;
        o[di2+3] = ca > 255 ? 255 : ca;
        continue;
      }
      let x0 = Math.floor(fx), y0 = Math.floor(fy);
      const ax = fx - x0, ay = fy - y0;
      let x1 = x0 + 1, y1 = y0 + 1;
      x0 = ((x0 % tw) + tw) % tw; x1 = ((x1 % tw) + tw) % tw;
      if (y0 < 0) y0 = 0; else if (y0 > th-1) y0 = th-1;
      if (y1 < 0) y1 = 0; else if (y1 > th-1) y1 = th-1;
      const i00 = (y0*tw + x0) << 2, i10 = (y0*tw + x1) << 2,
            i01 = (y1*tw + x0) << 2, i11 = (y1*tw + x1) << 2;
      const w00 = (1-ax)*(1-ay), w10 = ax*(1-ay), w01 = (1-ax)*ay, w11 = ax*ay;
      const a = px[i00+3]*w00 + px[i10+3]*w10 + px[i01+3]*w01 + px[i11+3]*w11;
      if (a < 4) continue;
      const di = (j*sw + i) << 2;
      o[di]   = px[i00  ]*w00 + px[i10  ]*w10 + px[i01  ]*w01 + px[i11  ]*w11;
      o[di+1] = px[i00+1]*w00 + px[i10+1]*w10 + px[i01+1]*w01 + px[i11+1]*w11;
      o[di+2] = px[i00+2]*w00 + px[i10+2]*w10 + px[i01+2]*w01 + px[i11+2]*w11;
      o[di+3] = a;
    }
  }
  relief.bctx.putImageData(out, 0, 0);
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = 0.96;
  ctx.drawImage(relief.buf, bx0, by0, bw, bh);
  ctx.restore();

  /* im Stillstand einmal fein nachziehen */
  if (q < Math.min(DPR || 1, 2)){
    clearTimeout(relief.fineTimer);
    relief.fineTimer = setTimeout(() => { if (!dragging) render(); }, 260);
  }
}

/* Jede Ebene wird nur aufgebaut, wenn ihr Datenmodul mitgeliefert wurde.
   Damit lassen sich aus denselben Bausteinen verschieden schwere Seiten bauen. */
const RAW = {};
try { RAW.m = MINES;    } catch(e){}
try { RAW.p = PLANTS;   } catch(e){}
try { RAW.y = MEM;      } catch(e){}
try { RAW.d = DCS;      } catch(e){}
try { RAW.r = PROC;     } catch(e){}
try { RAW.e = POWER;    } catch(e){}
try { RAW.h = HUBS;     } catch(e){}
try { RAW.c = CAPITALS; } catch(e){}
let RAW_LINKS = []; try { RAW_LINKS = LINKS; } catch(e){}
let ISO_MAP = {};   try { ISO_MAP = ISO3_2; } catch(e){}

const LAYER_SPEC = {
  m:{meta:MINE_META,  words:"mn", big:true },
  p:{meta:PLANT_META, words:"pl", big:true },
  y:{meta:MEM_META,   words:"me", big:true },
  d:{meta:DC_META,    words:"dc", big:false},
  r:{meta:PROC_META,  words:"pr", big:false},
  e:{meta:POWER_META, words:"pw", big:false},
  h:{meta:HUB_META,   words:"hb", big:false, allLv:true},
  c:{meta:CAP_META,   words:"cp", big:true }
};
const LAYERS = {};
const LAYER_KEYS = [];
for (const k of ["m","p","y","d","r","e","h","c"]){
  if (!RAW[k]) continue;
  LAYER_KEYS.push(k);
  LAYERS[k] = {arr:RAW[k], meta:LAYER_SPEC[k].meta, words:LAYER_SPEC[k].words,
               big:LAYER_SPEC[k].big, sel:k+"Filter", leg:k+"Legend",
               cfg:{show:true, allLv:!!LAYER_SPEC[k].allLv, filter:""}};
  for (const s of RAW[k]) s.k = k;
}

const linkCfg = {show:true, filter:""};
const eventCfg = {show:true, only:false, days:90};
let pulseActive = false;
const NOW = Date.now();
function eventCutoff(){ return eventCfg.days ? NOW - eventCfg.days*864e5 : 0; }
function recentEvents(s){
  if (!s._ev || !s._ev.length) return [];
  const c = eventCutoff();
  return s._ev.filter(e => e._t >= c);
}
const SITE_INDEX = {};
for (const k of LAYER_KEYS) for (const s of LAYERS[k].arr) SITE_INDEX[s.n] = s;
RAW_LINKS.forEach(l => { l._a = SITE_INDEX[l.a]; l._b = SITE_INDEX[l.b]; });
const LIVE_LINKS = RAW_LINKS.filter(l => l._a && l._b);

let visibleSites = [], hoveredSite = null, selectedSite = null, downXY = null;

const L = () => currentLang === "de";
const metaOf  = s => LAYERS[s.k].meta[s.t];
const wordsOf = s => i18n[currentLang][LAYERS[s.k].words];
const UI = () => i18n[currentLang].ui;

/* ---------- Formen ---------- */
function poly(c,x,y,r,n,rot){
  c.beginPath();
  for (let i=0;i<n;i++){
    const a = rot + i*2*Math.PI/n;
    const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    i ? c.lineTo(px,py) : c.moveTo(px,py);
  }
  c.closePath();
}
function rrect(c,x,y,w,h,k){
  c.beginPath();
  c.moveTo(x-w+k,y-h); c.lineTo(x+w-k,y-h); c.quadraticCurveTo(x+w,y-h,x+w,y-h+k);
  c.lineTo(x+w,y+h-k); c.quadraticCurveTo(x+w,y+h,x+w-k,y+h);
  c.lineTo(x-w+k,y+h); c.quadraticCurveTo(x-w,y+h,x-w,y+h-k);
  c.lineTo(x-w,y-h+k); c.quadraticCurveTo(x-w,y-h,x-w+k,y-h); c.closePath();
}
function shapePath(c, sh, x, y, r){
  switch(sh){
    case "circle": case "target": case "roll": c.beginPath(); c.arc(x,y,r,0,7); return;
    case "square": case "grid": c.beginPath(); c.rect(x-r*0.82,y-r*0.82,r*1.64,r*1.64); return;
    case "sqround": return rrect(c,x,y,r*0.82,r*0.82,r*0.32);
    case "diamond": c.beginPath(); c.moveTo(x,y-r*1.2); c.lineTo(x+r*0.9,y); c.lineTo(x,y+r*1.2); c.lineTo(x-r*0.9,y); c.closePath(); return;
    case "kite":    c.beginPath(); c.moveTo(x,y-r*1.15); c.lineTo(x+r,y-r*0.25); c.lineTo(x,y+r*1.15); c.lineTo(x-r,y-r*0.25); c.closePath(); return;
    case "hex":      return poly(c,x,y,r*1.05,6,-Math.PI/2);
    case "hexv":     return poly(c,x,y,r*1.05,6,0);
    case "pent":     return poly(c,x,y,r*1.1,5,-Math.PI/2);
    case "pentdown": return poly(c,x,y,r*1.1,5,Math.PI/2);
    case "oct":      return poly(c,x,y,r*1.05,8,Math.PI/8);
    case "tri":      return poly(c,x,y,r*1.25,3,-Math.PI/2);
    case "tridown":  return poly(c,x,y,r*1.25,3,Math.PI/2);
    case "triright": return poly(c,x,y,r*1.25,3,0);
    case "star": {
      c.beginPath();
      for (let i=0;i<10;i++){
        const rr = i%2 ? r*0.5 : r*1.25, a = -Math.PI/2 + i*Math.PI/5;
        const px = x+Math.cos(a)*rr, py = y+Math.sin(a)*rr;
        i ? c.lineTo(px,py) : c.moveTo(px,py);
      }
      c.closePath(); return;
    }
    case "gear": {
      c.beginPath();
      for (let i=0;i<16;i++){
        const rr = i%2 ? r*0.74 : r*1.15, a = i*Math.PI/8;
        const px = x+Math.cos(a)*rr, py = y+Math.sin(a)*rr;
        i ? c.lineTo(px,py) : c.moveTo(px,py);
      }
      c.closePath(); return;
    }
    case "chip":  case "chip2": return rrect(c,x,y,r*0.78,r*0.78,r*0.18);
    case "batt":     return rrect(c,x,y+r*0.1,r*0.62,r*0.88,r*0.18);
    case "capsule":  return rrect(c,x,y,r*1.1,r*0.62,r*0.5);
    case "capsulev": return rrect(c,x,y,r*0.6,r*1.1,r*0.5);
    case "tower":    return rrect(c,x,y,r*0.5,r*1.15,r*0.16);
    case "rack":     return rrect(c,x,y,r*0.88,r*0.8,r*0.14);
    case "roof":
      c.beginPath(); c.moveTo(x,y-r*1.2); c.lineTo(x+r,y-r*0.15); c.lineTo(x+r,y+r*0.9);
      c.lineTo(x-r,y+r*0.9); c.lineTo(x-r,y-r*0.15); c.closePath(); return;
    case "trap":
      c.beginPath(); c.moveTo(x-r*0.55,y-r*0.85); c.lineTo(x+r*0.55,y-r*0.85);
      c.lineTo(x+r*1.05,y+r*0.85); c.lineTo(x-r*1.05,y+r*0.85); c.closePath(); return;
    case "boat":
      c.beginPath(); c.moveTo(x-r*1.15,y-r*0.5); c.lineTo(x+r*1.15,y-r*0.5);
      c.quadraticCurveTo(x+r*0.9,y+r*0.95,x,y+r*0.95);
      c.quadraticCurveTo(x-r*0.9,y+r*0.95,x-r*1.15,y-r*0.5); c.closePath(); return;
    case "sphere": c.beginPath(); c.arc(x,y,r*1.02,0,7); return;
    case "flask":
      c.beginPath(); c.moveTo(x-r*0.34,y-r*1.15); c.lineTo(x+r*0.34,y-r*1.15);
      c.lineTo(x+r*0.34,y-r*0.35); c.lineTo(x+r*0.98,y+r*0.95); c.lineTo(x-r*0.98,y+r*0.95);
      c.lineTo(x-r*0.34,y-r*0.35); c.closePath(); return;
    case "pin":
      c.beginPath(); c.arc(x, y-r*0.28, r*0.85, Math.PI*0.86, Math.PI*0.14);
      c.lineTo(x, y+r*1.25); c.closePath(); return;
    case "hourglass":
      c.beginPath(); c.moveTo(x-r,y-r*1.05); c.lineTo(x+r,y-r*1.05); c.lineTo(x,y);
      c.lineTo(x+r,y+r*1.05); c.lineTo(x-r,y+r*1.05); c.lineTo(x,y); c.closePath(); return;
    case "capdot": case "capring": c.beginPath(); c.arc(x,y,r*0.8,0,7); return;
    case "bolt":
      c.beginPath(); c.moveTo(x-r*0.1,y-r*1.25); c.lineTo(x+r*0.85,y-r*1.25);
      c.lineTo(x+r*0.15,y-r*0.2); c.lineTo(x+r*0.75,y-r*0.2); c.lineTo(x-r*0.55,y+r*1.25);
      c.lineTo(x-r*0.05,y+r*0.15); c.lineTo(x-r*0.7,y+r*0.15); c.closePath(); return;
    default: c.beginPath(); c.arc(x,y,r,0,7);
  }
}
function shapeDetail(c, sh, x, y, r){
  c.save();
  c.strokeStyle = "rgba(6,12,22,0.75)";
  c.fillStyle   = "rgba(6,12,22,0.75)";
  c.lineWidth = Math.max(0.8, r*0.14);
  if (sh === "target"){ c.beginPath(); c.arc(x,y,r*0.42,0,7); c.fill(); }
  if (sh === "roll"){ c.beginPath(); c.arc(x,y,r*0.38,0,7); c.stroke(); }
  if (sh === "chip" || sh === "chip2"){
    const s = r*0.78, p = r*0.34;
    c.beginPath();
    for (const dy of [-s*0.45, s*0.45]){
      c.moveTo(x-s,y+dy); c.lineTo(x-s-p,y+dy);
      c.moveTo(x+s,y+dy); c.lineTo(x+s+p,y+dy);
    }
    c.moveTo(x-s*0.45,y-s); c.lineTo(x-s*0.45,y-s-p);
    c.moveTo(x+s*0.45,y-s); c.lineTo(x+s*0.45,y-s-p);
    c.stroke();
    if (sh === "chip2"){ c.beginPath(); c.rect(x-s*0.42,y-s*0.42,s*0.84,s*0.84); c.stroke(); }
  }
  if (sh === "grid"){ const s = r*0.82;
    c.beginPath(); c.moveTo(x,y-s); c.lineTo(x,y+s); c.moveTo(x-s,y); c.lineTo(x+s,y); c.stroke(); }
  if (sh === "rack"){ const s = r*0.88; c.beginPath();
    for (const dy of [-r*0.36, 0, r*0.36]){ c.moveTo(x-s*0.62,y+dy); c.lineTo(x+s*0.62,y+dy); } c.stroke(); }
  if (sh === "sphere"){ c.beginPath(); c.moveTo(x-r*0.95,y); c.lineTo(x+r*0.95,y); c.stroke(); }
  if (sh === "batt"){ c.beginPath(); c.rect(x-r*0.22,y-r*1.05,r*0.44,r*0.22); c.fill(); }
  if (sh === "tower"){ c.beginPath(); c.moveTo(x-r*0.5,y-r*0.45); c.lineTo(x+r*0.5,y-r*0.45); c.stroke(); }
  if (sh === "capsule"){ c.beginPath(); c.moveTo(x-r*0.35,y-r*0.62); c.lineTo(x-r*0.35,y+r*0.62); c.stroke(); }
  if (sh === "flask"){ c.beginPath(); c.moveTo(x-r*0.62,y+r*0.35); c.lineTo(x+r*0.62,y+r*0.35); c.stroke(); }
  if (sh === "pin"){ c.beginPath(); c.arc(x,y-r*0.28,r*0.3,0,7); c.fill(); }
  if (sh === "capdot"){ c.beginPath(); c.arc(x,y,r*0.3,0,7); c.fill(); }
  if (sh === "capring"){ c.beginPath(); c.arc(x,y,r*0.42,0,7); c.stroke(); }
  c.restore();
}

/* ---------- Hilfsfunktionen ---------- */
const dnCache = {};
function iso2of(iso3){ const cc = SITE_CC[iso3]; return cc ? cc[0] : (ISO_MAP[iso3] || ""); }
function siteCountry(s){
  const cc = SITE_CC[s.c];
  if (cc) return L() ? cc[1] : cc[2];
  const i2 = ISO_MAP[s.c];
  if (!i2) return s.c;
  const key = currentLang + i2;
  if (dnCache[key]) return dnCache[key];
  let n = i2;
  try { n = new Intl.DisplayNames([currentLang], {type:"region"}).of(i2) || i2; } catch(e){}
  return (dnCache[key] = n);
}
function siteFlag(s){ const i2 = iso2of(s.c); return i2 ? flagEmoji(i2) : ""; }
function siteName(s){ return (L() && s.n2) ? s.n2 : s.n; }
function siteSector(s){ const m = metaOf(s); return L()?m.de:m.en; }
function siteUnit(s){ if (s.ux) return L()?s.ux.d:s.ux.e; const m = metaOf(s); return L()?m.ud:m.ue; }
function siteNote(s){ return L() ? s.nd : (s.ne || s.nd); }
function siteOut(s){
  if (!s.pv) return s.ux ? siteUnit(s) : wordsOf(s).noOutput;
  const v = s.pv < 10 ? s.pv.toLocaleString(L()?"de-DE":"en-US",{maximumFractionDigits:1}) : fmt(s.pv);
  const u = siteUnit(s);
  return u ? v + " " + u : v;
}
function zoomF(){ return scale / (Math.min(W,H)/2.25); }
/* Auf kleinen Schirmen ist die Kugel klein, die Symbole dürfen dann nicht
   in voller Größe stehen bleiben, sonst überdecken sie den halben Globus. */
function screenF(){ return Math.min(1, Math.max(0.52, Math.min(W,H)/900)); }
function minLevel(cfg){
  if (cfg.allLv) return 1;
  const z = zoomF();
  const base = z < 0.9 ? 5 : z < 1.25 ? 4 : z < 1.8 ? 3 : z < 2.5 ? 2 : 1;
  /* kleiner Schirm: eine Stufe strenger, sonst klebt alles aufeinander */
  return Math.min(5, base + (Math.min(W,H) < 560 ? 1 : 0));
}
function onFront(lon, lat){
  return d3.geo.distance([lon, lat], [-rotation[0], -rotation[1]]) < Math.PI/2 - 0.02;
}

/* ---------- Lieferkettenlinien ---------- */
function drawLinks(){
  if (!linkCfg.show) return;
  const z = zoomF();
  /* Beim Drehen und Ziehen reichen wenige Stützpunkte je Bogen. Das spart
     bei 80 Linien rund zwei Drittel der Projektionsrechnungen pro Bild. */
  const moving = dragging || (state.rotate && hovered < 0 && !hoveredSite && !selectedSite);
  const SEG = moving ? 12 : 32;
  for (const lk of LIVE_LINKS){
    if (linkCfg.filter && lk.t !== linkCfg.filter) continue;
    const a = lk._a, b = lk._b;
    if (UC_FOCUS && !UC_SHOWALL){ if (!(UC_FOCUS.has(a.n) && UC_FOCUS.has(b.n))) continue; }
    else if (!LAYERS[a.k].cfg.show && !LAYERS[b.k].cfg.show) continue;
    const hi = (selectedSite === a || selectedSite === b || hoveredSite === a || hoveredSite === b);
    const interp = d3.geo.interpolate([a.lo,a.la], [b.lo,b.la]);
    const pts = [];
    for (let i=0;i<=SEG;i++) pts.push(interp(i/SEG));
    const col = LINK_META[lk.t].col;
    ctx.save();
    ctx.beginPath(); path({type:"LineString", coordinates:pts});
    ctx.strokeStyle = hi ? col : col + "55";
    ctx.lineWidth = hi ? 2.2 : 1;
    if (!hi) ctx.setLineDash([5,4]);
    ctx.stroke();
    ctx.restore();

    if (hi || z > 1.6){
      const m1 = interp(0.5), m2 = interp(0.54);
      if (onFront(m1[0],m1[1]) && onFront(m2[0],m2[1])){
        const p1 = projection(m1), p2 = projection(m2);
        const ang = Math.atan2(p2[1]-p1[1], p2[0]-p1[0]);
        const sz = hi ? 5 : 3.6;
        ctx.save(); ctx.translate(p1[0],p1[1]); ctx.rotate(ang);
        ctx.beginPath(); ctx.moveTo(sz,0); ctx.lineTo(-sz*0.7,sz*0.62); ctx.lineTo(-sz*0.7,-sz*0.62);
        ctx.closePath(); ctx.fillStyle = hi ? col : col + "99"; ctx.fill(); ctx.restore();
      }
    }
  }
}

/* ---------- Standorte zeichnen ---------- */
function drawSites(){
  visibleSites = [];
  const z = zoomF();
  const list = [];
  /* Fokus (Use Case oder Firma): genau die Standorte des Fokus zeigen,
     unabhängig von Ebenenschaltern, Stufen- und Sektorfilter. */
  const focusOnly = UC_FOCUS && !UC_SHOWALL;
  for (const key of LAYER_KEYS){
    const lay = LAYERS[key], cfg = lay.cfg;
    if (!focusOnly && !cfg.show) continue;
    const lim = minLevel(cfg);
    for (const s of lay.arr){
      if (focusOnly){
        if (!UC_FOCUS.has(s.n)) continue;
      } else {
        if (s.lv < lim) continue;
        if (cfg.filter && s.t !== cfg.filter) continue;
        if (eventCfg.only && !recentEvents(s).length) continue;
      }
      if (!onFront(s.lo, s.la)) continue;
      const p = projection([s.lo, s.la]);
      if (!p || p[0] < -50 || p[0] > W+50 || p[1] < -50 || p[1] > H+50) continue;
      list.push({s, x:p[0], y:p[1],
                 r:(3.4 + s.lv*1.45) * Math.min(1.55, Math.max(0.85, 0.75 + 0.25*z)) * screenF()});
    }
  }
  list.sort((a,b) => a.y - b.y);
  visibleSites = list;
  pulseActive = false;

  for (const it of list){
    const s = it.s, meta = metaOf(s), st = SITE_STATUS[s.st];
    const isHov = hoveredSite === s, isSel = selectedSite === s;
    const dim = ((s.st === "su") ? 0.45 : 1) * ((state.aiOnly && !aiLit(s)) ? 0.18 : 1) * ((UC_FOCUS && !UC_FOCUS.has(s.n)) ? 0.15 : 1);

    const evs = eventCfg.show ? recentEvents(s) : [];
    ctx.save();
    if (evs.length){
      pulseActive = true;
      const ph = (performance.now() % 2200) / 2200;
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r * (1.4 + ph*1.8), 0, 7);
      ctx.strokeStyle = `rgba(255,214,110,${(1-ph)*0.85})`;
      ctx.lineWidth = 1.8; ctx.stroke();
      ctx.beginPath(); ctx.arc(it.x - it.r*0.85, it.y - it.r*0.85, Math.max(4, it.r*0.5), 0, 7);
      ctx.fillStyle = "#ffd66e"; ctx.fill();
      ctx.fillStyle = "#141008"; ctx.font = "700 8px 'Segoe UI',system-ui,sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(evs.length), it.x - it.r*0.85, it.y - it.r*0.85 + 0.5);
      ctx.textBaseline = "alphabetic";
    }
    if (s.k === "m"){
      ctx.beginPath(); ctx.ellipse(it.x, it.y + it.r*0.95, it.r*0.9, it.r*0.32, 0, 0, 7);
      ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fill();
    } else if (s.k === "h"){
      /* Häfen und Meerengen bleiben ohne Sockel */
    } else {
      if ((s.k === "d" || s.k === "e") && s.st !== "pl" && s.st !== "co" && s.st !== "su" && isFinite(it.r) && it.r > 0){
        const g = ctx.createRadialGradient(it.x, it.y, it.r*0.5, it.x, it.y, it.r*2.6);
        g.addColorStop(0, meta.col + "55"); g.addColorStop(1, meta.col + "00");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(it.x, it.y, it.r*2.6, 0, 7); ctx.fill();
      }
      if (s.k !== "e"){
        ctx.fillStyle = "rgba(0,0,0,0.42)";
        ctx.fillRect(it.x - it.r*1.05, it.y + it.r*0.98, it.r*2.1, Math.max(1.6, it.r*0.28));
      }
    }

    shapePath(ctx, meta.sh, it.x, it.y, it.r);
    ctx.globalAlpha = s.st === "co" || s.st === "pl" ? 0.35*dim : 0.92*dim;
    ctx.fillStyle = meta.col; ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = isHov || isSel ? 2 : 1.2;
    ctx.strokeStyle = isHov || isSel ? "#ffffff" : "rgba(6,10,18,0.85)";
    if (s.st === "co" || s.st === "pl") ctx.setLineDash([3,2.5]);
    ctx.stroke(); ctx.setLineDash([]);
    if (it.r > 5) shapeDetail(ctx, meta.sh, it.x, it.y, it.r);
    if ((UC_FOCUS && UC_FOCUS.has(s.n)) || (s.aiu && (s.aiu.ai==="site" || s.aiu.ai==="infra" || (state.aiOnly && s.aiu.ai==="operator")))){
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r*1.55 + 1.5, 0, 7);
      const aiK = (s.aiu||{}).ai;
      ctx.lineWidth = aiK==="operator" ? 1 : 1.6;
      if (aiK==="operator") ctx.setLineDash([2,2.5]);
      ctx.strokeStyle = "rgba(92,255,176,0.9)"; ctx.stroke(); ctx.setLineDash([]);
    }

    if (s.st !== "op"){
      const bx = it.x + it.r*0.82, by = it.y - it.r*0.82;
      ctx.beginPath(); ctx.arc(bx, by, Math.max(2.1, it.r*0.3), 0, 7);
      ctx.fillStyle = st.col; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = "rgba(6,10,18,0.9)"; ctx.stroke();
    }

    if (z > 1.05 || s.lv >= 5 || isHov || isSel){
      const pw = Math.max(1.6, it.r*0.3), gap = pw*0.6, tot = s.lv*pw + (s.lv-1)*gap;
      let px = it.x - tot/2;
      const py = it.y + it.r*1.4;
      for (let i=0;i<s.lv;i++){ ctx.fillStyle = meta.col; ctx.fillRect(px, py, pw, pw*1.5); px += pw + gap; }
    }

    if (isHov || isSel || (z > 1.9 && s.lv >= 4)){
      ctx.font = "600 10.5px 'Segoe UI',system-ui,sans-serif";
      ctx.textAlign = "center";
      const label = siteName(s);
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(4,8,16,0.75)";
      ctx.fillRect(it.x - tw/2 - 4, it.y - it.r - 18, tw + 8, 14);
      ctx.fillStyle = "#eaf2ff"; ctx.fillText(label, it.x, it.y - it.r - 7.5);
    }
    ctx.restore();
  }
  updateSiteCount();
}

function pickSite(x,y){
  for (let i = visibleSites.length - 1; i >= 0; i--){
    const it = visibleSites[i];
    if (Math.hypot(x - it.x, y - it.y) <= it.r + 5) return it.s;
  }
  return null;
}

/* ==========================================================================
   EARTHTWIN  ·  Schnittstelle nach außen
   Jeder Standort bekommt eine stabile ID und ist über Koordinaten auffindbar.
   Damit lassen sich später Meldungen andocken: entweder per ID, per Name
   oder per Breiten- und Längengrad aus einem Nachrichtenstrom.
   ========================================================================== */

function slugify(str){
  return str.toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}

/* IDs vergeben, Ereignisliste anlegen */
(function assignIds(){
  const used = new Set();
  for (const k of LAYER_KEYS){
    for (const s of LAYERS[k].arr){
      let id = k + "-" + slugify(s.n), i = 2;
      while (used.has(id)) id = k + "-" + slugify(s.n) + "-" + (i++);
      used.add(id);
      s.id = id;
      s._ev = [];
    }
  }
})();

for (const s of ALL_SITES) BY_ID[s.id] = s;

function distKm(la1, lo1, la2, lo2){
  const R = 6371, rad = Math.PI/180;
  const dLa = (la2-la1)*rad, dLo = (lo2-lo1)*rad;
  const a = Math.sin(dLa/2)**2 +
            Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1, Math.sqrt(a)));
}

/* Ereignisse zuordnen: per ID, per Name oder über die Koordinaten */
function resolveEvent(e){
  if (e.id && BY_ID[e.id]) return BY_ID[e.id];
  if (e.site && SITE_INDEX[e.site]) return SITE_INDEX[e.site];
  if (typeof e.lat === "number" && typeof e.lon === "number"){
    const hit = EarthTwin.near(e.lat, e.lon, e.radius || 150)[0];
    if (hit) return hit.site;
  }
  if (e.text){
    const hit = EarthTwin.match(e.text);
    if (hit) return hit;
  }
  return null;
}

const EarthTwin = {
  version: "1.0",

  /* flache Liste, direkt weiterverarbeitbar */
  get sites(){
    return ALL_SITES.map(s => ({
      id:s.id, name:s.n, lat:s.la, lon:s.lo,
      layer:LAYER_NAME[s.k], type:s.t, country:s.c,
      status:s.st, level:s.lv, operator:s.ow,
      capacity:s.pv, planned:s.cp || null, since:s.yr || null
    }));
  },
  get links(){
    return LIVE_LINKS.map(l => ({from:l._a.id, to:l._b.id, type:l.t}));
  },
  get layers(){ return LAYER_NAME; },

  byId(id){ return BY_ID[id] || null; },
  byName(n){ return SITE_INDEX[n] || null; },

  /* alle Standorte im Umkreis, nach Entfernung sortiert */
  near(lat, lon, km = 200, layer){
    const out = [];
    for (const s of ALL_SITES){
      if (layer && LAYER_NAME[s.k] !== layer) continue;
      const d = distKm(lat, lon, s.la, s.lo);
      if (d <= km) out.push({site:s, id:s.id, name:s.n, km:Math.round(d*10)/10,
                             layer:LAYER_NAME[s.k], lat:s.la, lon:s.lo});
    }
    return out.sort((a,b) => a.km - b.km);
  },

  /* Meldung einem Standort zuordnen: erst Name im Text, dann Koordinaten */
  match(text, lat, lon, km = 150){
    if (text){
      const t = " " + text.toLowerCase() + " ";
      let best = null;
      for (const s of ALL_SITES){
        const n = s.n.toLowerCase();
        if (n.length > 3 && t.includes(n) && (!best || n.length > best.n.length)) best = s;
      }
      if (best) return best;
    }
    if (typeof lat === "number" && typeof lon === "number"){
      const hit = this.near(lat, lon, km)[0];
      if (hit) return hit.site;
    }
    return null;
  },

  /* Ereignisse setzen oder ergänzen */
  setEvents(list){ for (const s of ALL_SITES) s._ev = []; return this.addEvents(list); },
  addEvents(list){
    const unmatched = [];
    for (const e of (list || [])){
      const s = resolveEvent(e);
      if (!s){ unmatched.push(e); continue; }
      const t = Date.parse(e.date) || Date.now();
      s._ev.push({date:(e.date || "").slice(0,10), title:e.title || "", url:e.url || "",
                  src:e.src || "", sum:e.sum || "", kind:e.kind || "op", _t:t});
      s._ev.sort((a,b) => b._t - a._t);
    }
    this.unmatched = unmatched;
    if (typeof updateEventCount === "function") updateEventCount();
    if (typeof W === "number" && W) render();
    return {matched:(list||[]).length - unmatched.length, unmatched:unmatched.length};
  },
  get events(){
    const out = [];
    for (const s of ALL_SITES) for (const e of s._ev)
      out.push({siteId:s.id, name:s.n, lat:s.la, lon:s.lo, date:e.date, title:e.title,
                url:e.url, src:e.src, sum:e.sum, kind:e.kind});
    return out.sort((a,b) => (a.date < b.date ? 1 : -1));
  },
  clearEvents(){ return this.setEvents([]); },

  /* Globus auf einen Punkt drehen */
  flyTo(target, zoom){
    let la, lo;
    if (typeof target === "string"){
      const s = BY_ID[target] || SITE_INDEX[target];
      if (!s) return false;
      la = s.la; lo = s.lo; selectedSite = s; showDossier(s);
    } else if (Array.isArray(target)){ la = target[0]; lo = target[1]; }
    else return false;
    const from = [rotation[0], rotation[1]], to = [-lo, -la];
    let d = to[0] - from[0]; while (d > 180) d -= 360; while (d < -180) d += 360;
    const t0 = performance.now(), dur = 700;
    const step = now => {
      const q = Math.min(1, (now - t0)/dur), e = q<0.5 ? 2*q*q : 1-Math.pow(-2*q+2,2)/2;
      rotation[0] = from[0] + d*e;
      rotation[1] = from[1] + (to[1]-from[1])*e;
      needsPick = true; render();
      if (q < 1) requestAnimationFrame(step);
    };
    if (zoom){ scale = Math.min(Math.min(W,H)*3.2, (Math.min(W,H)/2.25) * zoom); }
    requestAnimationFrame(step);
    return true;
  },

  toJSON(){ return JSON.stringify({sites:this.sites, links:this.links}, null, 2); },
  toCSV(){
    const head = "id,name,lat,lon,layer,type,country,status,level,capacity,operator";
    const esc = v => `"${String(v == null ? "" : v).replace(/"/g,'""')}"`;
    return [head].concat(this.sites.map(s =>
      [s.id,s.name,s.lat,s.lon,s.layer,s.type,s.country,s.status,s.level,s.capacity,s.operator]
        .map(esc).join(","))).join("\n");
  }
};
window.EarthTwin = EarthTwin;
